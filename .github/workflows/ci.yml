name: CI

# Phase 0 item 3: the promotion of workflow-templates/ci.yml into the repository's
# real CI, with gates.yml folded in as SPEC.md calls for.
#
# The template could never have run as written. It set up a JDK and a Gradle cache
# but no Android SDK, so AGP had nothing to build against and every job would have
# died at configuration time. It also invoked `lint` and `test` — the variant-less
# aggregate tasks — where CLAUDE.md specifies `lintDebug` and `testDebugUnitTest`,
# and it ran neither `compileDebugKotlin` nor `detekt` at all. What lands here is
# the template's shape (gates first, APK build only behind them) over the setup
# that PR #18 and #19 established as the one that actually works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: compile · lint · detekt · test
    runs-on: ubuntu-latest
    # KSP runs twice (Hilt and Room) on a cold Gradle cache, and the first run on
    # a branch also downloads the compileSdk 35 platform. Thirty minutes is well
    # clear of that; beyond it the job is stuck and should fail rather than hold
    # a runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Every gate below runs even when an earlier one fails, so a single run
      # reports all four results instead of stopping at the first. `!cancelled()`
      # rather than `always()`: a cancelled run should stop, and any failed step
      # still fails the job, so this reports more without gating less.
      - name: compileDebugKotlin
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: lintDebug
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --stacktrace

      - name: detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --stacktrace

      - name: testDebugUnitTest
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build APK
    runs-on: ubuntu-latest
    # The template's ordering, kept: an APK is only worth producing once the code
    # that goes into it has compiled, linted and passed its tests.
    needs: [gates]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: assembleDebug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
