name: CI

# Phase 0 item 3: the promotion of workflow-templates/ci.yml into the repository's
# real CI, with gates.yml folded in as SPEC.md calls for.
#
# The template could never have run as written. It set up a JDK and a Gradle cache
# but no Android SDK, so AGP had nothing to build against and every job would have
# died at configuration time. It also invoked `lint` and `test` — the variant-less
# aggregate tasks — where CLAUDE.md specifies `lintDebug` and `testDebugUnitTest`,
# and it ran neither `compileDebugKotlin` nor `detekt` at all. What lands here is
# the template's shape (gates first, APK build only behind them) over the setup
# that PR #18 and #19 established as the one that actually works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Turns on the Compose compiler's stability metrics and reports, which
# `scripts/verify-compose-metrics.py` gates on below. `ORG_GRADLE_PROJECT_<name>` is Gradle's
# own way of setting a project property from the environment, and it is set here — at the
# workflow, not on the one step that needs it — on purpose: the property changes the compiler
# arguments, so a job where only some invocations carried it would recompile every Compose
# module each time a step switched it on or off.
env:
  ORG_GRADLE_PROJECT_composeCompilerReports: "true"

jobs:
  gates:
    name: modules · compile · lint · detekt · test
    runs-on: ubuntu-latest
    # KSP runs in most of the fifteen modules on a cold Gradle cache, and the first run on a
    # branch also downloads the compileSdk 35 platform. Forty minutes is well clear of that;
    # beyond it the job is stuck and should fail rather than hold a runner for the six-hour
    # default. Raised from thirty with the module split: the same work is now spread over more
    # Gradle projects, each with its own configuration and KSP round.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` defaults to `tools platform-tools`, and `tools` is the obsolete SDK
          # package Google removed from the repository years ago — cmdline-tools replaced it.
          # The action runs `sdkmanager tools` regardless, which now answers "Failed to find
          # package 'tools'" and exits 1, so this step fails on every run of both workflows
          # whatever the commit contains. Naming the one package that still exists keeps the
          # behaviour and drops the dead half.
          packages: 'platform-tools'

      # Every gate in this job runs even when an earlier one fails, so a single run reports
      # all five results instead of stopping at the first. `!cancelled()` rather than
      # `always()`: a cancelled run should stop, and any failed step still fails the job, so
      # this reports more without gating less.
      #
      # The module rules come first because they are seconds of work and they fail on a whole
      # class of change — a feature reaching into another feature, `:data` leaking into a
      # screen — that every gate below would happily compile. The rules are in the root
      # build.gradle.kts, next to the reasoning for each one.
      - name: checkModuleDependencies
        # The guard the comment above promises, which this step alone was missing — so the
        # gate the comment calls the most valuable of the five was the one step a failure
        # before it could skip, and a broken SDK setup did exactly that.
        if: ${{ !cancelled() }}
        run: ./gradlew checkModuleDependencies --stacktrace

      # Two seconds, no SDK and no Gradle needed, and it runs before the compile so a broken
      # verifier is reported immediately rather than twenty minutes later. The failure paths
      # are the reason that script exists and a green build exercises none of them.
      - name: verify-compose-metrics.py self-test
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-compose-metrics.test.py

      # No project path on any of these: the tasks exist in every module, so one invocation
      # covers all fifteen and a module added later is picked up without an edit here.
      #
      # `--no-build-cache` is here for the Compose reports and nowhere else. Their destinations
      # are internal compiler-plugin options rather than declared outputs of this task, so a
      # compile restored from the build cache writes none of them — and the cache is shared
      # across runs by setup-gradle, so the second CI run on a branch is exactly where that
      # would bite. The next step fails rather than passing quietly when it happens, which is
      # the point, but a gate that goes red for a caching reason is a gate people learn to
      # re-run. Only this invocation pays for it; every step below reuses what it produced.
      - name: compileDebugKotlin
        if: ${{ !cancelled() }}
        run: ./gradlew compileDebugKotlin --no-build-cache --stacktrace

      # SPEC.md Phase 10 item 2. The compiler decides, per composable, whether it can be
      # skipped on recomposition, and records that in a report nobody reads. StabilityContractTest
      # holds the state types to `@Immutable`/`@Stable`; this holds the composables built out of
      # them to actually skipping, which is the claim those annotations exist to buy.
      - name: Compose compiler metrics
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-compose-metrics.py

      # The exported schemas under data/schemas are what AppDatabaseMigrationTest starts every
      # migration from, so a version bump whose schema was generated and never committed turns
      # that whole suite into a test of nothing — it would migrate from the newest file it has
      # and pass. Room writes the schemas during KSP, which the step above ran; this checks that
      # what it just wrote is what the commit carries.
      #
      # Both halves are needed: a changed file shows up in `git diff`, and a brand-new version's
      # file is untracked, which `git diff` does not see at all.
      #
      # On a Gradle cache hit `:data:copyRoomSchemas` reports NO-SOURCE, because KSP did not
      # re-run and so wrote no schema, and this step then compares the commit against itself.
      # That is not a hole: KSP's inputs are `:data`'s sources, so a run where it did not re-run
      # is a run where the schema could not have changed. The step only ever has something to
      # say on the runs where it could.
      - name: Room schemas are committed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          untracked="$(git ls-files --others --exclude-standard -- data/schemas)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::Room exported a schema that is not in the commit. Run the build locally and add data/schemas."
            exit 1
          fi
          if ! git diff --exit-code -- data/schemas; then
            echo "::error::data/schemas differs from what Room just generated. Commit the regenerated schema."
            exit 1
          fi
          echo "Exported schemas match the commit:"
          git ls-files -- data/schemas

      - name: lintDebug
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --stacktrace

      - name: detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --stacktrace

      - name: testDebugUnitTest
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          # Every module's reports, not just `:app`'s — a lint or detekt finding can now come
          # from any of fifteen.
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/test-results/
            **/build/compose-reports/
            **/build/compose-metrics/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build · verify APK · shrink
    runs-on: ubuntu-latest
    # The template's ordering, kept: an APK is only worth producing once the code
    # that goes into it has compiled, linted and passed its tests.
    needs: [gates]
    # Raised from thirty when the shrunk variant joined this job. R8 over fifteen modules' worth
    # of classes plus ML Kit, CameraX and Compose is a few minutes on top of the debug build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` defaults to `tools platform-tools`, and `tools` is the obsolete SDK
          # package Google removed from the repository years ago — cmdline-tools replaced it.
          # The action runs `sdkmanager tools` regardless, which now answers "Failed to find
          # package 'tools'" and exits 1, so this step fails on every run of both workflows
          # whatever the commit contains. Naming the one package that still exists keeps the
          # behaviour and drops the dead half.
          packages: 'platform-tools'

      # Two seconds, no SDK needed, and it runs before the ~3 minutes of Gradle work so a
      # broken verifier is reported immediately rather than after the build.
      - name: verify-apk.sh self-test
        run: ./scripts/verify-apk.test.sh

      # Same reasoning, for the shrinker's verifier: seconds, no SDK, and a broken verifier is
      # reported now rather than after the R8 step it would have gated.
      - name: verify-r8-mapping.py self-test
        run: python3 scripts/verify-r8-mapping.test.py

      # writeDebugApkIdentity emits the package/version/sdk values the APK is expected to
      # carry, straight out of the build DSL, for the verification step below.
      - name: assembleDebug
        run: ./gradlew assembleDebug writeDebugApkIdentity --stacktrace

      # Phase 0 item 4. assembleDebug exiting 0 says the build ran; this says the artifact
      # is one the platform would actually install: well-formed, 4-byte aligned, signed
      # with the debug key under a v2+ scheme across API 26-35, and carrying the package,
      # versionCode, versionName and sdk levels build.gradle.kts declares.
      #
      # apksigner, zipalign and aapt2 come from the build-tools AGP installs for
      # compileSdk during the step above, so no separate sdkmanager step is needed.
      - name: Verify APK is installable
        run: ./scripts/verify-apk.sh

      # SPEC.md Phase 11 item 4. The only place R8 runs at all.
      #
      # `minified` and not `release`: `release` cannot be built here on purpose — `:data` fails
      # `compileReleaseKotlin` while the certificate pins and the Play Integrity project are
      # empty, and they are empty because the values would have to name a real server and a real
      # Play Console app. app/build.gradle.kts has the build type and the reasoning. Without this
      # step app/proguard-rules.pro is a file no build reads, which is how it came to hold two
      # rules that matched nothing at all.
      #
      # In this job rather than one of its own because the variant consumes the libraries' `debug`
      # halves, which `assembleDebug` above has just built: R8 is the only new work, and a
      # separate runner would recompile fifteen modules to do it.
      - name: assembleMinified
        id: shrink
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleMinified --stacktrace

      # R8 writes the rules it would need for every reference it could not resolve. When it fails
      # for that reason the file is the answer, and printing it here turns a two-round diagnosis
      # into one.
      - name: Unresolved references R8 reported
        if: ${{ failure() && steps.shrink.conclusion == 'failure' }}
        run: |
          missing=app/build/outputs/mapping/minified/missing_rules.txt
          if [ -f "$missing" ]; then
            echo "::group::$missing"
            cat "$missing"
            echo "::endgroup::"
          else
            echo "No $missing — the failure above is not an unresolved reference."
          fi

      # Checks the keep rules by their effect on the shrunk output: what survived, what kept its
      # name, and whether R8 had to guess about anything. A keep rule cannot fail on its own —
      # R8 does not warn about a pattern that matches no class — so this is what stops one going
      # quiet after a package move or a dependency bump.
      - name: Keep rules still match what they were written for
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-r8-mapping.py

      # The mapping file is the whole value of shrinking a build you then have to support: without
      # it every frame of every crash report from that artifact says `a.b.c.a`. Uploaded
      # separately from the APK below and kept for the maximum GitHub allows, because a crash
      # arrives weeks after the build and a mapping that expired is a stack trace nobody can read.
      # `usage.txt` and `seeds.txt` go with it when R8 wrote them — they are what says *why*
      # something was kept or dropped, which is the question a surprising retrace raises.
      #
      # This is not the release mapping. The build that goes to Play is signed with the upload key
      # and uploaded with its own mapping, which is Phase 11's signing item, not this one.
      - name: Upload R8 mapping
        if: ${{ !cancelled() && hashFiles('app/build/outputs/mapping/minified/mapping.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-minified
          path: app/build/outputs/mapping/minified/
          if-no-files-found: error
          retention-days: 90

      # Uploaded even when verification fails: when the APK is wrong, the APK is the
      # evidence, and re-running CI to get a copy of it wastes a round trip. Gated on the
      # file existing so a failed assembleDebug reports one failure rather than two —
      # a missing APK on the success path is already a hard failure in the step above.
      - name: Upload APK
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
