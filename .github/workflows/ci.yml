name: CI

# Phase 0 item 3: the promotion of workflow-templates/ci.yml into the repository's
# real CI, with gates.yml folded in as SPEC.md calls for.
#
# The template could never have run as written. It set up a JDK and a Gradle cache
# but no Android SDK, so AGP had nothing to build against and every job would have
# died at configuration time. It also invoked `lint` and `test` — the variant-less
# aggregate tasks — where CLAUDE.md specifies `lintDebug` and `testDebugUnitTest`,
# and it ran neither `compileDebugKotlin` nor `detekt` at all. What lands here is
# the template's shape (gates first, APK build only behind them) over the setup
# that PR #18 and #19 established as the one that actually works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Turns on the Compose compiler's stability metrics and reports, which
# `scripts/verify-compose-metrics.py` gates on below. `ORG_GRADLE_PROJECT_<name>` is Gradle's
# own way of setting a project property from the environment, and it is set here — at the
# workflow, not on the one step that needs it — on purpose: the property changes the compiler
# arguments, so a job where only some invocations carried it would recompile every Compose
# module each time a step switched it on or off.
env:
  ORG_GRADLE_PROJECT_composeCompilerReports: "true"

jobs:
  gates:
    name: modules · compile · lint · detekt · test
    runs-on: ubuntu-latest
    # KSP runs in most of the fifteen modules on a cold Gradle cache, and the first run on a
    # branch also downloads the compileSdk 35 platform. Forty minutes is well clear of that;
    # beyond it the job is stuck and should fail rather than hold a runner for the six-hour
    # default. Raised from thirty with the module split: the same work is now spread over more
    # Gradle projects, each with its own configuration and KSP round.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` defaults to `tools platform-tools`, and `tools` is the obsolete SDK
          # package Google removed from the repository years ago — cmdline-tools replaced it.
          # The action runs `sdkmanager tools` regardless, which now answers "Failed to find
          # package 'tools'" and exits 1, so this step fails on every run of both workflows
          # whatever the commit contains. Naming the one package that still exists keeps the
          # behaviour and drops the dead half.
          packages: 'platform-tools'

      # Every gate in this job runs even when an earlier one fails, so a single run reports
      # all five results instead of stopping at the first. `!cancelled()` rather than
      # `always()`: a cancelled run should stop, and any failed step still fails the job, so
      # this reports more without gating less.
      #
      # The module rules come first because they are seconds of work and they fail on a whole
      # class of change — a feature reaching into another feature, `:data` leaking into a
      # screen — that every gate below would happily compile. The rules are in the root
      # build.gradle.kts, next to the reasoning for each one.
      - name: checkModuleDependencies
        # The guard the comment above promises, which this step alone was missing — so the
        # gate the comment calls the most valuable of the five was the one step a failure
        # before it could skip, and a broken SDK setup did exactly that.
        if: ${{ !cancelled() }}
        run: ./gradlew checkModuleDependencies --stacktrace

      # Two seconds, no SDK and no Gradle needed, and it runs before the compile so a broken
      # verifier is reported immediately rather than twenty minutes later. The failure paths
      # are the reason that script exists and a green build exercises none of them.
      - name: verify-compose-metrics.py self-test
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-compose-metrics.test.py

      # No project path on any of these: the tasks exist in every module, so one invocation
      # covers all fifteen and a module added later is picked up without an edit here.
      #
      # `--no-build-cache` is here for the Compose reports and nowhere else. Their destinations
      # are internal compiler-plugin options rather than declared outputs of this task, so a
      # compile restored from the build cache writes none of them — and the cache is shared
      # across runs by setup-gradle, so the second CI run on a branch is exactly where that
      # would bite. The next step fails rather than passing quietly when it happens, which is
      # the point, but a gate that goes red for a caching reason is a gate people learn to
      # re-run. Only this invocation pays for it; every step below reuses what it produced.
      - name: compileDebugKotlin
        if: ${{ !cancelled() }}
        run: ./gradlew compileDebugKotlin --no-build-cache --stacktrace

      # SPEC.md Phase 10 item 2. The compiler decides, per composable, whether it can be
      # skipped on recomposition, and records that in a report nobody reads. StabilityContractTest
      # holds the state types to `@Immutable`/`@Stable`; this holds the composables built out of
      # them to actually skipping, which is the claim those annotations exist to buy.
      - name: Compose compiler metrics
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-compose-metrics.py

      # The exported schemas under data/schemas are what AppDatabaseMigrationTest starts every
      # migration from, so a version bump whose schema was generated and never committed turns
      # that whole suite into a test of nothing — it would migrate from the newest file it has
      # and pass. Room writes the schemas during KSP, which the step above ran; this checks that
      # what it just wrote is what the commit carries.
      #
      # Both halves are needed: a changed file shows up in `git diff`, and a brand-new version's
      # file is untracked, which `git diff` does not see at all.
      #
      # On a Gradle cache hit `:data:copyRoomSchemas` reports NO-SOURCE, because KSP did not
      # re-run and so wrote no schema, and this step then compares the commit against itself.
      # That is not a hole: KSP's inputs are `:data`'s sources, so a run where it did not re-run
      # is a run where the schema could not have changed. The step only ever has something to
      # say on the runs where it could.
      - name: Room schemas are committed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          untracked="$(git ls-files --others --exclude-standard -- data/schemas)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::Room exported a schema that is not in the commit. Run the build locally and add data/schemas."
            exit 1
          fi
          if ! git diff --exit-code -- data/schemas; then
            echo "::error::data/schemas differs from what Room just generated. Commit the regenerated schema."
            exit 1
          fi
          echo "Exported schemas match the commit:"
          git ls-files -- data/schemas

      - name: lintDebug
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --stacktrace

      - name: detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --stacktrace

      - name: testDebugUnitTest
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          # Every module's reports, not just `:app`'s — a lint or detekt finding can now come
          # from any of fifteen.
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/test-results/
            **/build/compose-reports/
            **/build/compose-metrics/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: licences · known vulnerabilities
    runs-on: ubuntu-latest
    # SPEC.md Phase 11 item 6, both halves, in one job because they are two questions about one
    # list: Licensee resolves `:app`'s debug runtime classpath and writes every external module in
    # it to a report, the licence check validates that report, and scan-dependencies.py scans the
    # same file against OSV. Splitting them across two runners would resolve the graph twice to
    # ask about it twice.
    #
    # Not `needs: [gates]`. This resolves a configuration and reads POMs; it compiles nothing of
    # this repository's own, so there is no reason to queue it behind twenty minutes of Kotlin —
    # and a licence or CVE finding is worth reporting even on a commit that does not compile.
    #
    # No compilation, so this is Gradle configuration plus POM downloads: a few minutes on a cold
    # cache. Twenty is well clear of it, and past that the job is stuck rather than slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` defaults to `tools platform-tools`, and `tools` is the obsolete SDK
          # package Google removed from the repository years ago — cmdline-tools replaced it.
          # The action runs `sdkmanager tools` regardless, which now answers "Failed to find
          # package 'tools'" and exits 1, so this step fails on every run of both workflows
          # whatever the commit contains. Naming the one package that still exists keeps the
          # behaviour and drops the dead half.
          packages: 'platform-tools'

      # Seconds, no SDK, no Gradle and no network, and it runs before the Gradle work so a broken
      # scanner is reported immediately rather than after the step it would have gated. The
      # failure paths are the reason that script exists and a clean dependency graph exercises
      # none of them.
      - name: scan-dependencies.py self-test
        if: ${{ !cancelled() }}
        run: python3 scripts/scan-dependencies.test.py

      # `:app:licenseeDebug` and not the unqualified task: Licensee is applied to `:app` alone,
      # whose runtime classpath is the shipped set and a superset of every other module's.
      # `debug` because `release` is deliberately unbuildable in this repository — the reasoning
      # is in app/build.gradle.kts next to the `licensee { }` block.
      - name: Licence gate
        id: licences
        if: ${{ !cancelled() }}
        run: ./gradlew :app:licenseeDebug --stacktrace

      # Licensee names the artifact and the licence it could not accept in its own report, and
      # that report is the answer to "which entry is missing from the allow list". Printing it
      # here turns a two-round diagnosis into one.
      - name: What Licensee rejected
        if: ${{ failure() && steps.licences.conclusion == 'failure' }}
        run: |
          report=app/build/reports/licensee/debug/validation.txt
          if [ -f "$report" ]; then
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          else
            echo "No $report — the failure above happened before validation ran, so it is"
            echo "about resolving the classpath rather than about a licence."
          fi

      # Runs even when the licence gate failed, for the reason every gate in the `gates` job
      # does: one run should report both results rather than stopping at the first. Licensee
      # writes artifacts.json before it validates, so the scan has its input either way — and if
      # it does not, the scanner says so and fails rather than reporting a clean graph.
      - name: Known-vulnerability gate
        if: ${{ !cancelled() }}
        run: python3 scripts/scan-dependencies.py

      - name: Upload the licence report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: app/build/reports/licensee/
          if-no-files-found: ignore
          retention-days: 7

  upload-signing:
    name: upload signing
    runs-on: ubuntu-latest
    # No compilation at all: `checkUploadSigning` and `signingReport` are configuration-time tasks
    # and `--dry-run` only prints a task graph, so what this job pays for is one Gradle
    # configuration of fifteen modules, several times over. Twenty-five minutes is well clear of
    # that on a cold cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Needed even though nothing here compiles: AGP cannot configure an Android project without
      # an SDK to resolve `compileSdk` against, and every task this job runs is one AGP registers.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Two seconds, no SDK and no Gradle needed, and it runs first so a broken rehearsal is
      # reported immediately rather than after the Gradle work it would have gated. The rehearsal's
      # happy path runs below on every build; its failure paths — the reason it exists — run
      # nowhere else at all.
      - name: verify-upload-signing.sh self-test
        run: ./scripts/verify-upload-signing.test.sh

      # SPEC.md Phase 11 item 5, and the only thing that ever exercises the signing configuration.
      # `release` cannot be built in this repository — `:data` fails `compileReleaseKotlin` while
      # the certificate pins and the Play Integrity project are empty — and the real upload key is
      # in a secret store a fork cannot read, so without this the whole signing block in
      # app/build.gradle.kts would be code no build runs. It generates its own key and needs no
      # secret of any kind.
      - name: Rehearse release signing
        run: ./scripts/verify-upload-signing.sh

  startup-benchmark:
    name: Baseline profile · startup budget
    runs-on: ubuntu-latest
    # Same ordering as `build` below, for the same reason: a startup measurement is only worth
    # taking once the code that starts up has compiled, linted and passed its tests.
    needs: [gates]
    # The long one, and every minute of it is accounted for: R8 over fifteen modules for the
    # `benchmark` variant and a second, unshrunk build for `nonMinifiedBenchmark`; an emulator
    # cold boot; fifteen generation iterations; then twenty measured cold starts, each of which
    # reinstalls or recompiles the app before launching it. Ninety minutes is clear of that on a
    # cold Gradle cache. Beyond it the emulator is wedged — which happens — and the job should
    # fail rather than hold a runner for the six-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # See the note on this input in the `gates` job: the action's default `tools` package no
          # longer exists in the SDK repository and fails the step on every run.
          packages: 'platform-tools'

      # An emulator without KVM falls back to software CPU emulation, which is roughly an order of
      # magnitude slower — enough that the boot alone outlives this job's timeout, and enough that
      # any number measured on it would be meaningless anyway. GitHub's Linux runners expose
      # /dev/kvm but not to the runner's own user, so this is the standard udev rule that grants
      # it. It is not an optimisation: without it this gate cannot run at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Seconds, no SDK and no emulator needed, and it runs first so a broken verifier is reported
      # immediately rather than after an hour of Gradle and emulator work. Its failure paths — a
      # regression over budget, a stale profile, a warmup that made the numbers unattributable —
      # run nowhere else at all: a green gate exercises none of them.
      - name: verify-startup-budget.py self-test
        run: python3 scripts/verify-startup-budget.test.py

      # Built before the emulator comes up rather than inside the step below, so that a build
      # failure is a build failure and not an emulator step that timed out. Both app variants and
      # both test APKs: `nonMinifiedBenchmark` is what the profile is recorded against and
      # `benchmark` is what is measured — app/build.gradle.kts has the reasoning for the split.
      - name: Build the benchmark variants
        run: |
          ./gradlew \
            :app:assembleBenchmark :app:assembleNonMinifiedBenchmark \
            :benchmark:assembleBenchmark :benchmark:assembleNonMinifiedBenchmark \
            --stacktrace

      # `default` and not `google_apis` or an ATD image: the AOSP image is a userdebug build with
      # the AOSP launcher, which is what `pressHome()` needs and what keeps ART's profile commands
      # available. API 34 is pinned here and in config/benchmark/startup-budget.json, and the
      # verifier fails when the two disagree — the API level decides what ART does with a baseline
      # profile, so a run on another one is not comparable to the budget.
      #
      # Two Gradle invocations, one per variant, because they are two different runs against two
      # different builds of the app. The generator goes first: its output is what the staleness
      # half of the gate compares the committed profile against.
      - name: Generate the profile and measure startup
        id: measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          # Macrobenchmark needs the screen on and the window animations off. The action's own
          # flag does the second; `-no-boot-anim` and `-no-window` keep the first from costing a
          # GPU that is software rasterisation anyway.
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # One word, and deliberately so. This input is not handed to a shell as written: the
          # action runs the lines through `/usr/bin/sh` joined together, which is dash on an Ubuntu
          # runner and which never sees a `\` continuation as one. Two runs of this gate were spent
          # learning that — "Illegal option -o pipefail", then
          # "Task '\' not found in root project" — and both are properties of the action rather
          # than of anything this repository controls. The script is a file with its own shebang;
          # scripts/run-startup-benchmark.sh carries the two Gradle invocations and the reasoning.
          script: ./scripts/run-startup-benchmark.sh

      # The gate. Holds both cases to config/benchmark/startup-budget.json and the committed
      # profile to the one this run just generated.
      #
      # Before the profile is printed, not after, and that ordering is load-bearing: this step's
      # output is a dozen lines ending in the measured medians, and the step below is several
      # thousand lines of generated profile. Run the other way round, the numbers somebody needs in
      # order to act on a failure are buried in a log nobody scrolls to the middle of.
      #
      # Runs even when the step above failed, because a partial run still has something to say
      # about which half broke.
      - name: Startup is inside budget and the profile is current
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-startup-budget.py

      # Separate from the bundle below and deliberately so: one file, named for what it is, so that
      # regenerating the committed profile is a download and a copy rather than an archaeology
      # exercise. docs/baseline-profiles.md points here.
      - name: Upload the generated profile on its own
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-baseline-profile
          path: benchmark/build/outputs/**/*-baseline-prof.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload benchmark output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark
          path: |
            benchmark/build/outputs/**/*-benchmarkData.json
            benchmark/build/outputs/**/*-baseline-prof.txt
            benchmark/build/reports/
            benchmark/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      # The generated profile, with its identity, emitted into the log and uploaded on its own.
      #
      # This is the one output of this job a human has to act on: when the committed profile is
      # missing or has gone stale, the fix is to replace it with this file. It gets its own
      # single-file artifact as well as the log, because the alternative is finding it among the
      # forty-odd files the step below collects.
      #
      # ## Why this is base64 and not the file
      #
      # It was `cat`, for one run, and that run proved the route does not work. Two limits decide
      # the shape of this step, and neither is negotiable from inside this repository:
      #
      #   * The Actions API serves **at most the last 5000 lines** of a job log. This profile is
      #     longer than that on its own, so a plain dump arrives with its head cut off — the first
      #     run of this gate produced one that began mid-`androidx/navigation`, missing every rule
      #     before it. A truncated profile is worse than none: it parses, it passes the rule-count
      #     floor, and it is silently missing the startup path.
      #   * Actions artifacts are served from `*.blob.core.windows.net`, which the scheduled agent
      #     that maintains this repository cannot reach — its egress policy answers 403 on CONNECT.
      #     The same agent has no Android SDK, because `dl.google.com` is denied too, so it cannot
      #     record a profile itself either.
      #
      # So the only channel from this emulator to a commit is the log, and the payload has to fit
      # the window. gzip takes a baseline profile to roughly a fifth of its size — it is thousands
      # of lines sharing a handful of package prefixes — and base64 at 76 columns brings the whole
      # file in at well under a thousand lines, head included.
      #
      # It is emitted last, after the uploads, for the same reason: whatever else this job prints,
      # the payload stays inside the window.
      #
      # `gzip -n` so the bytes depend only on the profile and not on when it was compressed, and
      # the step decodes its own output and compares the digest before printing it. A channel that
      # carries a profile has to be checkable rather than trusted: a single mistyped rule is
      # exactly the failure this whole gate exists to catch, since AGP drops a rule that matches
      # nothing without a word. The `sha256` below is of the profile itself, so it verifies the
      # round trip end to end — decode, decompress, commit, check.
      - name: Profile this run generated
        id: generated-profile
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          generated=(benchmark/build/outputs/**/*-baseline-prof.txt)
          if [ ${#generated[@]} -eq 0 ]; then
            echo "No profile was generated — the generator step above did not get that far."
            exit 0
          fi
          for file in "${generated[@]}"; do
            echo "$file"
            echo "  sha256: $(sha256sum "$file" | cut -d' ' -f1)"
            echo "  lines:  $(wc -l < "$file")"
            echo "  bytes:  $(wc -c < "$file")"
          done
          echo
          echo "The readable file is the generated-baseline-profile artifact. The block below is"
          echo "the same bytes, for whoever cannot reach artifact storage. To rebuild it from a"
          echo "saved copy of this log — the ^ and \$ anchors are load-bearing, or this very"
          echo "paragraph matches too, and the API serves these lines with a timestamp prefix"
          echo "that has to come off first:"
          echo
          echo "    sed -e 's/^[0-9-]*T[0-9:.]*Z //' job.log \\"
          echo "      | sed -n '/^-----BEGIN BASELINE PROFILE GZIP BASE64-----\$/,/^-----END BASELINE PROFILE GZIP BASE64-----\$/p' \\"
          echo "      | sed '1d;\$d' | base64 -d | gunzip > app/src/main/baseline-prof.txt"
          echo "    sha256sum app/src/main/baseline-prof.txt   # must equal the sha256 above"
          echo
          for file in "${generated[@]}"; do
            gzip -9 -n -c "$file" | base64 -w 76 > profile.b64
            # Decoded here, before it is printed, so a channel that mangles the profile fails this
            # job instead of handing somebody a plausible file to commit.
            if [ "$(base64 -d profile.b64 | gunzip | sha256sum | cut -d' ' -f1)" \
                 != "$(sha256sum "$file" | cut -d' ' -f1)" ]; then
              echo "::error::base64 round trip did not reproduce $file"
              exit 1
            fi
            echo "::group::$file (gzip, base64, $(wc -l < profile.b64) lines)"
            echo "-----BEGIN BASELINE PROFILE GZIP BASE64-----"
            cat profile.b64
            echo "-----END BASELINE PROFILE GZIP BASE64-----"
            echo "::endgroup::"
            rm -f profile.b64
          done

  build:
    name: Build · verify APK · shrink
    runs-on: ubuntu-latest
    # The template's ordering, kept: an APK is only worth producing once the code
    # that goes into it has compiled, linted and passed its tests.
    needs: [gates]
    # Raised from thirty when the shrunk variant joined this job. R8 over fifteen modules' worth
    # of classes plus ML Kit, CameraX and Compose is a few minutes on top of the debug build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` defaults to `tools platform-tools`, and `tools` is the obsolete SDK
          # package Google removed from the repository years ago — cmdline-tools replaced it.
          # The action runs `sdkmanager tools` regardless, which now answers "Failed to find
          # package 'tools'" and exits 1, so this step fails on every run of both workflows
          # whatever the commit contains. Naming the one package that still exists keeps the
          # behaviour and drops the dead half.
          packages: 'platform-tools'

      # Two seconds, no SDK needed, and it runs before the ~3 minutes of Gradle work so a
      # broken verifier is reported immediately rather than after the build.
      - name: verify-apk.sh self-test
        run: ./scripts/verify-apk.test.sh

      # Same reasoning, for the shrinker's verifier: seconds, no SDK, and a broken verifier is
      # reported now rather than after the R8 step it would have gated.
      - name: verify-r8-mapping.py self-test
        run: python3 scripts/verify-r8-mapping.test.py

      # writeDebugApkIdentity emits the package/version/sdk values the APK is expected to
      # carry, straight out of the build DSL, for the verification step below.
      - name: assembleDebug
        run: ./gradlew assembleDebug writeDebugApkIdentity --stacktrace

      # Phase 0 item 4. assembleDebug exiting 0 says the build ran; this says the artifact
      # is one the platform would actually install: well-formed, 4-byte aligned, signed
      # with the debug key under a v2+ scheme across API 26-35, and carrying the package,
      # versionCode, versionName and sdk levels build.gradle.kts declares.
      #
      # apksigner, zipalign and aapt2 come from the build-tools AGP installs for
      # compileSdk during the step above, so no separate sdkmanager step is needed.
      - name: Verify APK is installable
        run: ./scripts/verify-apk.sh

      # SPEC.md Phase 11 item 4. The only place R8 runs at all.
      #
      # `minified` and not `release`: `release` cannot be built here on purpose — `:data` fails
      # `compileReleaseKotlin` while the certificate pins and the Play Integrity project are
      # empty, and they are empty because the values would have to name a real server and a real
      # Play Console app. app/build.gradle.kts has the build type and the reasoning. Without this
      # step app/proguard-rules.pro is a file no build reads, which is how it came to hold two
      # rules that matched nothing at all.
      #
      # In this job rather than one of its own because the variant consumes the libraries' `debug`
      # halves, which `assembleDebug` above has just built: R8 is the only new work, and a
      # separate runner would recompile fifteen modules to do it.
      - name: assembleMinified
        id: shrink
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleMinified --stacktrace

      # R8 writes the rules it would need for every reference it could not resolve. When it fails
      # for that reason the file is the answer, and printing it here turns a two-round diagnosis
      # into one.
      - name: Unresolved references R8 reported
        if: ${{ failure() && steps.shrink.conclusion == 'failure' }}
        run: |
          missing=app/build/outputs/mapping/minified/missing_rules.txt
          if [ -f "$missing" ]; then
            echo "::group::$missing"
            cat "$missing"
            echo "::endgroup::"
          else
            echo "No $missing — the failure above is not an unresolved reference."
          fi

      # Checks the keep rules by their effect on the shrunk output: what survived, what kept its
      # name, and whether R8 had to guess about anything. A keep rule cannot fail on its own —
      # R8 does not warn about a pattern that matches no class — so this is what stops one going
      # quiet after a package move or a dependency bump.
      - name: Keep rules still match what they were written for
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-r8-mapping.py

      # The mapping file is the whole value of shrinking a build you then have to support: without
      # it every frame of every crash report from that artifact says `a.b.c.a`. Uploaded
      # separately from the APK below and kept for the maximum GitHub allows, because a crash
      # arrives weeks after the build and a mapping that expired is a stack trace nobody can read.
      # `usage.txt` and `seeds.txt` go with it when R8 wrote them — they are what says *why*
      # something was kept or dropped, which is the question a surprising retrace raises.
      #
      # This is not the release mapping. The build that goes to Play is signed with the upload key
      # and uploaded with its own mapping, which is Phase 11's signing item, not this one.
      - name: Upload R8 mapping
        if: ${{ !cancelled() && hashFiles('app/build/outputs/mapping/minified/mapping.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-minified
          path: app/build/outputs/mapping/minified/
          if-no-files-found: error
          retention-days: 90

      # Uploaded even when verification fails: when the APK is wrong, the APK is the
      # evidence, and re-running CI to get a copy of it wastes a round trip. Gated on the
      # file existing so a failed assembleDebug reports one failure rather than two —
      # a missing APK on the success path is already a hard failure in the step above.
      - name: Upload APK
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
