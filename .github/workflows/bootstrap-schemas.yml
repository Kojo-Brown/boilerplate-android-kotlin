name: Bootstrap Room schemas (temporary)

# TEMPORARY. This workflow exists to seed `data/schemas` once and is deleted from this branch
# before it merges.
#
# `exportSchema = true` and `room { schemaDirectory(…) }` have both been set since PR #36, so
# Room has been writing a schema file on every build since then — and nobody ever committed one.
# That leaves versions 1 and 2 unrecoverable from the current tree: Room's compiler only ever
# exports the version the code in front of it declares, so the only way to get the older two is
# to build the commits that declared them. That needs the Android SDK and Google Maven, which
# the scheduled agent's environment cannot reach (dl.google.com answers 403 on CONNECT — see
# scripts/jvm-harness/README.md), so this runs here instead.
#
# The files are printed rather than uploaded so they can be read straight out of the job log.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    name: Export schema for database version ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The commit before PR #39, the last one whose @Database declared version = 1.
          - version: 1
            ref: 5aa38e07660ef17bbd2dc7382258e37675ee5249
          # PR #39 itself, which added `users.version` and `users.locallyChanged` as version 2.
          - version: 2
            ref: b723ff2360b0c6e7e0e721bc2cef5e7008985aa0
          # This branch, for the current version.
          - version: head
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # KSP is what runs Room's compiler, and compiling `:data` is enough to reach it.
      - name: Generate schemas
        run: ./gradlew :data:compileDebugKotlin --stacktrace

      - name: Print every exported schema
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            found=1
            echo "----- BEGIN $file"
            cat "$file"
            echo ""
            echo "----- END $file"
          done < <(find . -path '*/schemas/*' -name '*.json' -not -path '*/build/*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No exported schema found. Look for one under a build directory:"
            find . -path '*schemas*' -name '*.json' | sort
            exit 1
          fi
