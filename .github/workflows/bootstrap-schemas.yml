name: Bootstrap schemas

# TEMPORARY, and deleted in the commit that uses its output.
#
# `data/schemas/…/4.json` was hand-written on a machine that cannot run Room's compiler
# (`dl.google.com` is 403 under the scheduled agent's egress policy, so there is no Android SDK
# and no androidx artifact). Its `identityHash` is an MD5 over Room's own serialisation of the
# schema and cannot be derived by hand, so it went in as a placeholder of 32 zeros.
#
# The `Room schemas are committed` step in ci.yml was supposed to catch that and did not: on the
# run for this branch `:data:kspDebugKotlin` executed and `:data:copyRoomSchemas` still reported
# NO-SOURCE, so `git diff -- data/schemas` compared the commit against itself and reported a
# match. That is the same hole ci.yml documents for a Gradle cache hit, except it is not limited
# to one — which is the second thing this workflow is here to establish.
#
# So it does two jobs at once: print what Room actually exports for version 4, and show where it
# puts it.

on:
  workflow_dispatch:
  push:
    branches: [feat/idempotent-sync-keys]

permissions:
  contents: read

jobs:
  export:
    name: Export the version 4 schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The placeholder is moved out of the way first. Room's exporter skips a file it considers
      # current, and the whole question here is what it writes when it has to write something —
      # leaving a file in place is how the last run learned nothing.
      - name: Remove the placeholder so Room has to write one
        run: rm -f data/schemas/com.kojo.boilerplate.core.database.AppDatabase/4.json

      # `--rerun-tasks` on the one task that matters, because a cache hit is precisely the state
      # in which this workflow would produce nothing.
      - name: Run Room's annotation processor
        run: ./gradlew :data:kspDebugKotlin --rerun-tasks --stacktrace

      - name: Where did the schema go
        if: ${{ !cancelled() }}
        run: |
          echo "== git status over data/schemas =="
          git status --porcelain -- data/schemas || true
          echo
          echo "== every *.json Room may have written, anywhere under data/ =="
          find data -name '*.json' -path '*schema*' -print 2>/dev/null || true
          find data/build -name '4.json' -print 2>/dev/null || true

      - name: Print the exported version 4 schema
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          exported="$(find data -name '4.json' | head -1)"
          if [ -z "$exported" ]; then
            echo "::error::Room exported no 4.json anywhere under data/. copyRoomSchemas is not wiring the schema through, which is the bug ci.yml's gate has been hiding."
            exit 1
          fi
          echo "Found: $exported"
          echo "----- BEGIN 4.json -----"
          cat "$exported"
          echo
          echo "----- END 4.json -----"

      - name: Upload it
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: exported-schemas
          path: |
            data/schemas/**/*.json
            data/build/**/schemas/**/*.json
          if-no-files-found: warn
          retention-days: 1
