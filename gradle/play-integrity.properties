# Play Integrity: which Google Cloud project this build's integrity tokens are encrypted to.
#
# Read at configuration time by data/build.gradle.kts, which validates it and writes it into
# BuildConfig.INTEGRITY_CLOUD_PROJECT_NUMBER. IntegrityConfiguration.parse reads that field back
# out, IntegrityModule provides the result, and PlayIntegrityAttestation asks Play for tokens
# on behalf of that project.
#
# It is empty in this boilerplate, and that is not an oversight: the number below has to name a
# real Cloud project that is linked to a real app in Play Console, and this repository is linked
# to neither. An empty value means attestation is off — every attest() answers NOT_CONFIGURED
# and requests go out without a token. A made-up number would instead fail with
# CLOUD_PROJECT_NUMBER_IS_INVALID on every device, which is the same outcome by a slower route
# and a worse error message.
#
# :data:compileReleaseKotlin fails while this file is empty, so shipping a release with
# attestation off is a decision somebody has to make rather than one they can drift into. Debug
# builds are deliberately exempt: they are what CI assembles, and CI has no Play Console project.
#
# ---------------------------------------------------------------------------------------------
# FORMAT
#
#   cloudProjectNumber = <decimal number>
#
# ---------------------------------------------------------------------------------------------
# WHERE THE NUMBER COMES FROM
#
# Play Console > your app > Release > App integrity > Integrity API > "Link a Cloud project".
# The number is the *project number* of the linked Google Cloud project — the all-digits one,
# not the project ID. The same project's service account is what the backend authenticates with
# when it calls playintegrity.googleapis.com/v1/PACKAGE_NAME:decodeIntegrityToken.
#
# It is not a secret. It identifies a project; it does not grant access to one. It is visible in
# the Cloud console to anyone who can see the project, and knowing it lets nobody decrypt a
# token. The credential that *does* decrypt one is the backend's service-account key, which
# lives in the server's secret store and never comes near this repository or the APK.
#
# ---------------------------------------------------------------------------------------------
# THE HALF THAT IS NOT HERE
#
# A token this app sends proves nothing until a server decodes it and acts on the verdict
# inside. Filling this file in does not turn on root detection; it turns on the client's side of
# it. docs/root-detection.md has the server's side, the verdict fields worth branching on, and
# why none of that belongs in the app.
#
# ---------------------------------------------------------------------------------------------
# EXAMPLE — the shape, with a number that is deliberately not a real project.
#
# cloudProjectNumber = 123456789012
