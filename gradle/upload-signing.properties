# Play Store signing: which key the release build is signed with, and nothing that key needs.
#
# Read at configuration time by app/build.gradle.kts, which validates every value, decodes the
# keystore out of the environment and builds `signingConfigs.release` from the two halves. The key
# material never appears here and never appears in this repository: it arrives in three
# environment variables that CI fills from the GitHub secret store, and is written only to
# app/build/signing/, which .gitignore covers.
#
# It is empty in this boilerplate, and that is not an oversight. The values below name a key that
# a real Play Console app was created with, and this repository is linked to no Play app. An empty
# file means release signing is off, and `:app:assembleRelease` and `:app:bundleRelease` then fail
# rather than producing an artifact — which is the whole point of the file, because the thing AGP
# does when a release variant has no signing config is write `app-release-unsigned.apk` and exit 0.
#
# `release` cannot be built here for two other deliberate reasons anyway: `:data` fails
# `compileReleaseKotlin` while gradle/certificate-pins.properties and
# gradle/play-integrity.properties are empty. This is the third of the three, and the only one of
# them whose failure mode is a *shippable* artifact rather than a build error.
#
# ---------------------------------------------------------------------------------------------
# FORMAT
#
#   keyAlias          = <the alias of the key inside the keystore>
#   certificateSha256 = <SHA-256 of that key's certificate>
#
# Both are public. The alias is a label, and the certificate fingerprint is printed by
# `apksigner verify --print-certs` for anybody holding a copy of the APK — Play Console shows it
# on the App Integrity page for exactly that reason. Neither grants anything: what signs a build
# is the private key, which stays in the secret store.
#
# The fingerprint is accepted as 64 hex characters in either case, with or without the `:`
# separators keytool and Play Console print between the bytes.
#
# ---------------------------------------------------------------------------------------------
# THE HALF THAT IS NOT HERE
#
# Three environment variables, which CI sets from repository secrets of the same names and which
# a local release build has to export by hand:
#
#   UPLOAD_KEYSTORE_BASE64     the keystore file, base64, no newlines
#   UPLOAD_KEYSTORE_PASSWORD   the keystore's own password
#   UPLOAD_KEY_PASSWORD        the password on the key named by `keyAlias`
#
# The build requires all three the moment this file declares an alias, and fails naming the ones
# it did not find. There is no fallback to a checked-in keystore, to gradle.properties, to
# local.properties or to `~/.gradle`: a signing key that can be reached from a clone is a signing
# key that leaks with the clone, and a fallback is what makes "it worked on my machine" a release
# signed with something nobody meant to use.
#
# ---------------------------------------------------------------------------------------------
# WHY A FINGERPRINT IS CHECKED IN AT ALL
#
# Because the failure this item exists to prevent is signing with the *wrong* key, and nothing
# else in the pipeline can see it. Play identifies an upload by its certificate: a build signed
# with a key Play has not been told about is rejected outright, and — worse, because it succeeds —
# the very first upload of a new app enrols whatever key it arrives with. Passwords and base64 in
# a secret store are opaque by design, so a rotated secret that points at a different keystore
# than the one intended produces a green build and a signed artifact, and the only place the
# difference is visible is the fingerprint. Declaring it here turns that into a build failure with
# both values in the message.
#
# It also documents which key a given commit was meant to be released with, which is the question
# asked six months later when there are two keystores in the secret manager.
#
# ---------------------------------------------------------------------------------------------
# RULES THE BUILD ENFORCES
#
#   * Both keys together or neither. A fingerprint with no alias cannot be checked against
#     anything, and an alias with no fingerprint is the check this file exists for, switched off.
#   * The keystore must actually open with UPLOAD_KEYSTORE_PASSWORD, must contain `keyAlias`, and
#     that key must open with UPLOAD_KEY_PASSWORD. All three fail here, at configuration time,
#     with a message naming which one — rather than inside apksigner at the end of a release
#     build.
#   * The certificate's SHA-256 must equal `certificateSha256`.
#   * The certificate must not be the Android debug certificate. A debug-signed upload is
#     rejected by Play, and a debug key that reached a release signing config is a debug key
#     somebody has made load-bearing.
#   * The certificate must stay valid past 2033-10-22, which is Play's floor for an upload key.
#     A key that expires is a key that cannot ship an update, and the expiry is set once at
#     generation and never noticed again.
#
# docs/release-signing.md has key generation, what goes in the secret store, how Play App Signing
# splits the upload key from the app signing key, and what to do when either is lost.
#
# ---------------------------------------------------------------------------------------------
# EXAMPLE — the shape, with a fingerprint that is deliberately not a real certificate's.
#
# keyAlias = upload
# certificateSha256 = 00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF
