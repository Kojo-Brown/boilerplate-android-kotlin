# Certificate pinning: which hosts this app pins, to what, and until when.
#
# Read at configuration time by data/build.gradle.kts, which validates every value and writes
# them into BuildConfig.CERTIFICATE_PINS and BuildConfig.CERTIFICATE_PIN_EXPIRY. PinningPolicy
# parses those two fields back out and NetworkModule installs the result on both OkHttp clients.
#
# It is empty in this boilerplate, and that is not an oversight: the pins below would have to
# name the public keys of a real server, this one points at api.example.com, and pins that are
# wrong are strictly worse than no pins — every request fails and no server-side change can fix
# it. An empty file means pinning is off and the app uses ordinary system trust.
#
# `:data:compileReleaseKotlin` fails while this file declares no pins, so an unpinned build
# cannot be released by accident. Debug builds are deliberately exempt, which is also what makes
# it possible to put a proxy in front of the app.
#
# ---------------------------------------------------------------------------------------------
# FORMAT
#
#   expires = <ISO-8601 instant>
#   <host pattern> = <pin>,<pin>[,<pin>…]
#
# Every key other than `expires` is an OkHttp host pattern:
#
#   api.example.com      exactly that host
#   *.example.com        exactly one label below example.com — NOT example.com itself
#   **.example.com       any depth below example.com
#
# A pin is `sha256/` followed by Base64 of the SHA-256 of the certificate's subject public key
# info. It pins the KEY, not the certificate, so a renewal that reuses the key needs no app
# release. Compute one from a live host with:
#
#   openssl s_client -servername api.example.com -connect api.example.com:443 </dev/null \
#     | openssl x509 -pubkey -noout \
#     | openssl pkey -pubin -outform der \
#     | openssl dgst -sha256 -binary \
#     | openssl enc -base64
#
# ---------------------------------------------------------------------------------------------
# RULES THE BUILD ENFORCES
#
#   * At least two pins per host. One pin is one key's lifetime; the second is a backup key that
#     is generated, kept offline and not yet serving traffic. Without it the next key rotation is
#     an app release plus however long it takes every user to install it.
#   * An expiry is mandatory. After it, pinning stops being enforced rather than bricking old
#     installations. Set it to roughly the point at which you would no longer trust a build of
#     this app to know the current keys — months, not years.
#   * The host this app talks to (BuildConfig.BASE_URL) must be covered by one of the patterns.
#     OkHttp treats a host with no pins as unpinned rather than as an error, so a typo here is
#     pinning that silently protects nothing.
#
# docs/certificate-pinning.md has the rotation procedure and what to do when a pin fails.
#
# ---------------------------------------------------------------------------------------------
# EXAMPLE — the shape, with placeholder pins that are deliberately not real key hashes.
#
# expires = 2027-03-01T00:00:00Z
# api.example.com = sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=,sha256/ERERERERERERERERERERERERERERERERERERERERERE=
