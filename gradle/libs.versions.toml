[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
detekt = "1.23.8"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
datastore = "1.1.1"
# 2.52 cannot read Kotlin 2.1 metadata — hiltJavaCompileDebug died with
# "Unable to read Kotlin metadata due to unsupported metadata version", which
# blocked lintDebug and testDebugUnitTest alike. 2.57.2 is the newest release
# whose own Kotlin toolchain (kotlin-metadata-jvm / kotlin-stdlib 2.1.21) stays
# in the same 2.1.x line as this project's Kotlin 2.1.0; later releases jump to
# 2.3.x on the processor classpath for no benefit here.
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
# 2.9.0 ships lint checks built against a newer Kotlin Analysis API than the lint
# bundled with AGP 8.7.3, so lintAnalyzeDebug crashed rather than reporting:
# "Found class org.jetbrains.kotlin.analysis.api.resolution.KaCallableMemberCall, but
# interface was expected", inside androidx.lifecycle.lint.NonNullableMutableLiveDataDetector.
# 2.8.7 predates that split and carries every API this project uses (LocalLifecycleOwner
# and collectAsStateWithLifecycle both landed in 2.8.0). The forward fix is to raise AGP
# instead — see the note in SPEC.md.
lifecycleRuntimeKtx = "2.8.7"
navigationCompose = "2.8.5"
room = "2.7.0"
coroutines = "1.9.0"
serialization = "1.7.3"
retrofit = "2.11.0"
okhttp = "4.12.0"
serializationRetrofit = "1.0.0"
credentials = "1.5.0"
googleid = "1.1.1"
mockk = "1.13.14"
junit-jupiter = "5.11.4"
# 0.4.0 and 0.5.x are both published, and both are the wrong pin for Kotlin 2.1.0.
# 0.5.0/0.5.1 are compiled against kotlin-stdlib 2.3.0, whose metadata this compiler
# cannot read at all; 0.4.0 is on 2.1.20, which reads fine but drags the stdlib ahead
# of the compiler and makes every compile task warn that the runtime JARs are newer
# than the API version. 0.3.8 is the newest release built on a stdlib at or below
# 2.1.0, and it carries the full ImmutableList/PersistentList surface this uses.
kotlinxCollectionsImmutable = "0.3.8"
cameraX = "1.4.2"
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
# javax.inject on its own, for the modules that name `@Inject` or `Provider` without declaring a
# binding. Hilt drags it in transitively, but `implementation(libs.hilt.android)` does not put it
# on a *consumer's* compile classpath — so a module whose public API carries a `Provider`, as
# `SyncStrategyFactory` does, has to say so itself.
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Kotlin Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Immutable / persistent collections. The Compose compiler's KnownStableConstructs names
# every type in this artifact as externally stable, which is what makes an `ImmutableList`
# property stable where a `List` property is not.
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# Retrofit + OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "serializationRetrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# CameraX
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }

# MLKit
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Google Credential Manager
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Gradle plugins, as libraries. `build-logic` needs these three on its own compile classpath to
# write against their DSL types — `LibraryExtension`, `JvmTarget`, `DetektExtension`; the marker
# artifacts under [plugins] are how a build script applies them, which is a different question.
# Both refer to the same versions above, so the two can never drift.
#
# The Compose, KSP and Hilt Gradle plugins are deliberately absent: `build-logic` applies them by
# id and never names a type from one. Adding `hilt-android-gradle-plugin` here also breaks that
# compilation outright — it carries a Kotlin 2.x `.kotlin_module` the `kotlin-dsl` compiler
# refuses to read.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

# Testing
# kotlin-reflect is test-only on purpose. `StabilityContractTest` needs the Kotlin
# declaration model — `val` vs `var`, sealed subclasses, generic type arguments —
# none of which survives into Java reflection. Shipping it in the app would add
# ~1.7 MB to the APK to answer a question only the build asks.
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit-jupiter" }

# Adaptive
androidx-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
