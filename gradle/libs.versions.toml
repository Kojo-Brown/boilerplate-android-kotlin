[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
detekt = "1.23.8"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
datastore = "1.1.1"
# Protobuf, for the typed preferences schema in `:core:datastore-proto`. One version covers the
# compiler (`protoc`, fetched as a native binary) and the runtime (`protobuf-javalite`), and
# they must not drift: protobuf 4.x generated code validates the runtime's version in its static
# initialiser and throws when the runtime is the older of the two. Verified at this version
# offline — protoc emits Java that compiles at source level 8 and round-trips against the
# javalite of the same release — because none of the Gradle gates can run in the agent's
# environment.
protobuf = "4.36.1"
# The Gradle plugin is versioned separately from protobuf itself and moves far more slowly.
# 0.9.6 is the newest of the 0.9.x line, which drives AGP through the original variant API
# (`BaseVariant`, `registerJavaGeneratingTask`) that 8.7.3 still ships. 0.10.0 rewrote that onto
# the new `AndroidComponentsExtension` sources API; it is the right destination, and it is a
# change to make when AGP moves rather than alongside a first `.proto` file.
protobufPlugin = "0.9.6"
# 2.52 cannot read Kotlin 2.1 metadata — hiltJavaCompileDebug died with
# "Unable to read Kotlin metadata due to unsupported metadata version", which
# blocked lintDebug and testDebugUnitTest alike. 2.57.2 is the newest release
# whose own Kotlin toolchain (kotlin-metadata-jvm / kotlin-stdlib 2.1.21) stays
# in the same 2.1.x line as this project's Kotlin 2.1.0; later releases jump to
# 2.3.x on the processor classpath for no benefit here.
hilt = "2.57.2"
# The `androidx.hilt` group — the Jetpack integrations that sit on top of Dagger's Hilt rather
# than Dagger itself, so it versions separately from `hilt` above. One key for all three
# artifacts because they ship as a single release wave and are not supported mixed: the
# `hilt-compiler` that generates a `@HiltWorker`'s factory has to be the one that matches the
# `hilt-work` runtime reading it. This was `hiltNavigationCompose` while
# `hilt-navigation-compose` was the only one of them in use; the pin is unchanged at 1.2.0.
androidxHilt = "1.2.0"
# 2.9.0 ships lint checks built against a newer Kotlin Analysis API than the lint
# bundled with AGP 8.7.3, so lintAnalyzeDebug crashed rather than reporting:
# "Found class org.jetbrains.kotlin.analysis.api.resolution.KaCallableMemberCall, but
# interface was expected", inside androidx.lifecycle.lint.NonNullableMutableLiveDataDetector.
# 2.8.7 predates that split and carries every API this project uses (LocalLifecycleOwner
# and collectAsStateWithLifecycle both landed in 2.8.0). The forward fix is to raise AGP
# instead — see the note in SPEC.md.
lifecycleRuntimeKtx = "2.8.7"
navigationCompose = "2.8.5"
room = "2.7.0"
# WorkManager. 2.10.0 rather than the newest release, for a reason that is about this
# repository rather than about WorkManager: `lifecycleRuntimeKtx` above is held at 2.8.7 because
# 2.9.0 crashes the lint bundled with AGP 8.7.3, and Gradle resolves a dependency to the
# *highest* version anyone in the graph asks for. 2.10.0 predates lifecycle 2.9.0 entirely, so
# nothing it drags in can undo that pin; a later WorkManager could, and the failure would
# surface as the lint crash described above rather than as anything naming WorkManager.
#
# It also wants compileSdk 35, which is what `BoilerplateBuild.COMPILE_SDK` already is.
work = "2.10.0"
# Paging 3. Held on the 3.3.x line — 3.3.6 is its last release — rather than moved to the
# newest stable, for the same reason `lifecycleRuntimeKtx` above is held at 2.8.7: Gradle
# resolves a dependency to the *highest* version anyone in the graph asks for, so a Paging
# release built against a later AndroidX vintage can drag `androidx.lifecycle` past 2.8.7 and
# crash the lint bundled with AGP 8.7.3. The failure would name a lint detector rather than
# Paging, which is what makes it worth pinning deliberately instead of tracking latest. 3.3.6
# predates lifecycle 2.9.0 entirely, so nothing it brings in can undo that pin.
#
# `room-paging` is not here: it versions with the rest of Room and uses `room` above, which is
# what keeps the generated `PagingSource` and the Room runtime reading it on the same release.
paging = "3.3.6"
coroutines = "1.9.0"
serialization = "1.7.3"
retrofit = "2.11.0"
okhttp = "4.12.0"
serializationRetrofit = "1.0.0"
credentials = "1.5.0"
googleid = "1.1.1"
mockk = "1.13.14"
junit-jupiter = "5.11.4"
# Robolectric is here for exactly one thing: `AppDatabaseMigrationTest`, which needs a real
# SQLite database and a real `Context` and has nowhere else to run — `androidTest` never
# executes in this repository (Phase 12's emulator matrix is still unchecked), so a migration
# suite written as an instrumented test would be a gate that never fires. 4.16.1 is the newest
# stable release and the first line that ships an `android-all` image for API 35, which is this
# repository's `compileSdk` and what `@Config(sdk = …)` in that test asks for.
robolectric = "4.16.1"
# 0.4.0 and 0.5.x are both published, and both are the wrong pin for Kotlin 2.1.0.
# 0.5.0/0.5.1 are compiled against kotlin-stdlib 2.3.0, whose metadata this compiler
# cannot read at all; 0.4.0 is on 2.1.20, which reads fine but drags the stdlib ahead
# of the compiler and makes every compile task warn that the runtime JARs are newer
# than the API version. 0.3.8 is the newest release built on a stdlib at or below
# 2.1.0, and it carries the full ImmutableList/PersistentList surface this uses.
kotlinxCollectionsImmutable = "0.3.8"
cameraX = "1.4.2"
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# The typed half of the same release. `datastore-preferences` is this artifact plus a `Serializer`
# for an untyped key/value map; taking both is not duplication, it is the two stores this app has.
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }

# Protobuf. `protoc` is declared as a library because that is how the protobuf Gradle plugin
# takes it — an artifact coordinate it resolves and executes, not something on a classpath.
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
# javax.inject on its own, for the modules that name `@Inject` or `Provider` without declaring a
# binding. Hilt drags it in transitively, but `implementation(libs.hilt.android)` does not put it
# on a *consumer's* compile classpath — so a module whose public API carries a `Provider`, as
# `SyncStrategyFactory` does, has to say so itself.
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
# `@HiltWorker` is two artifacts and both are needed: `hilt-work` carries the annotation and the
# `HiltWorkerFactory` the Application hands to WorkManager, and `hilt-compiler` is the KSP
# processor that writes the factory entry for each worker. Declaring only the first compiles and
# then fails at runtime with "Could not instantiate …Worker", because nothing generated the
# binding the factory looks the worker up in.
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# What lets a `@Query` return a `PagingSource<Int, UserEntity>`. Without it the DAO method
# compiles as far as Kotlin is concerned and Room's processor fails with "Type of the parameter
# must be a class annotated with @Entity or a collection/array of it", naming nothing about
# Paging.
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }

# Paging 3
# `paging-common` is the plain-JVM half — `PagingData`, `PagingConfig`, `PagingSource`,
# `RemoteMediator` — and is all `:core:paging` needs to declare the contract. `paging-runtime`
# adds the Android half (`Pager`'s `LiveData`/`RecyclerView` surface and the platform
# dispatchers) and belongs to `:data`, which is where the `Pager` is actually constructed.
androidx-paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Kotlin Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Immutable / persistent collections. The Compose compiler's KnownStableConstructs names
# every type in this artifact as externally stable, which is what makes an `ImmutableList`
# property stable where a `List` property is not.
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# Retrofit + OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "serializationRetrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# CameraX
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }

# MLKit
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Google Credential Manager
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Gradle plugins, as libraries. `build-logic` needs these three on its own compile classpath to
# write against their DSL types — `LibraryExtension`, `JvmTarget`, `DetektExtension`; the marker
# artifacts under [plugins] are how a build script applies them, which is a different question.
# Both refer to the same versions above, so the two can never drift.
#
# The Compose, KSP and Hilt Gradle plugins are deliberately absent: `build-logic` applies them by
# id and never names a type from one. Adding `hilt-android-gradle-plugin` here also breaks that
# compilation outright — it carries a Kotlin 2.x `.kotlin_module` the `kotlin-dsl` compiler
# refuses to read.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

# Testing
# kotlin-reflect is test-only on purpose. `StabilityContractTest` needs the Kotlin
# declaration model — `val` vs `var`, sealed subclasses, generic type arguments —
# none of which survives into Java reflection. Shipping it in the app would add
# ~1.7 MB to the APK to answer a question only the build asks.
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit-jupiter" }
# `RobolectricTestRunner` is a JUnit 4 runner, so it reaches the JUnit Platform through the
# vintage engine above — which is already on every module's test runtime for the JUnit 4
# classes that predate the JUnit 5 move.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Adaptive
androidx-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
