# Project-wide Gradle settings.

# The Gradle daemon needs generous heap for AGP + KSP (Hilt and Room both run
# annotation processors) and for the Kotlin compiler daemon it forks.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX. Required: every dependency in libs.versions.toml is an androidx.*
# or Jetpack artifact, and AGP fails the build if this is not set.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# R8 in full mode. This is AGP 8's default, and it is written down anyway for two reasons.
#
# It is the flag somebody reaches for when a release build starts crashing with a
# `NullPointerException` in a library's reflection: setting it to `false` makes the symptom go
# away, ships an app whose shrinker is a version behind, and leaves no trace of the decision.
# Present and true, turning it off is a diff with a reviewer rather than a line nobody added.
#
# It also pins the behaviour across an AGP bump in either direction. Full mode changes what
# survives shrinking — generic signatures and annotations are stripped from classes that are not
# kept, default constructors of reflectively-instantiated classes are not kept, and an interface
# with no visible implementation is assumed to have none — so a build that silently switched modes
# would change which keep rules `app/proguard-rules.pro` still needs. docs/r8.md has the list and
# what each rule there is holding up.
android.enableR8.fullMode=true
